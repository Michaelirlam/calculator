<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <div class="calculator">
        <div class="display">
            <output class="display" id="display">0</output>
        </div>
        <div class="digits-container">
            <button id="digit-0" type="button">0</button>
            <button id="digit-1" type="button">1</button>
            <button id="digit-2" type="button">2</button>
            <button id="digit-3" type="button">3</button>
            <button id="digit-4" type="button">4</button>
            <button id="digit-5" type="button">5</button>
            <button id="digit-6" type="button">6</button>
            <button id="digit-7" type="button">7</button>
            <button id="digit-8" type="button">8</button>
            <button id="digit-9" type="button">9</button>
            <button id="decimal" type="button">.</button>
            <button id="clear" type="button">C</button>
        </div>
        <div class="operators-container">
            <button id="add" type="button">+</button>
            <button id="subtract" type="button">−</button>
            <button id="multiply" type="button">×</button>
            <button id="divide" type="button">&divide;</button>
            <button id="equals" type="button">=</button>
        </div>
    </div>
  </body>
</html>
